<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laburo Deportivo</title>
<meta name="description" content="Avisos de periodismo y contenido deportivo, actualizados tres veces por día.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<style>
  :root {
    --fondo: #f4f5f2;
    --tarjeta: #ffffff;
    --texto: #1c2321;
    --suave: #5d6763;
    --borde: #dde1dc;
    --acento: #157a4a;
    --acento-texto: #ffffff;
    --nuevo: #e8a317;
    --nuevo-texto: #2b1d00;
    --error-fondo: #fdecea;
    --error-texto: #8a1c12;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #121614;
      --tarjeta: #1b211e;
      --texto: #e8ece9;
      --suave: #9aa59f;
      --borde: #2c3530;
      --acento: #3ec482;
      --acento-texto: #08130d;
      --nuevo: #f2b632;
      --nuevo-texto: #2b1d00;
      --error-fondo: #3a1d1a;
      --error-texto: #ffb4aa;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fondo);
    color: var(--texto);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .contenedor { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; }

  header { padding: 24px 0 8px; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.02em; }
  .actualizado { margin: 4px 0 0; color: var(--suave); font-size: 0.9rem; }

  .alerta {
    margin: 12px 0 0; padding: 10px 12px; border-radius: 10px;
    background: var(--error-fondo); color: var(--error-texto); font-size: 0.9rem;
  }

  /* Filtros: fila de "chips" que se puede deslizar con el dedo */
  .filtros {
    position: sticky; top: 0; z-index: 1;
    background: var(--fondo);
    padding: 12px 0 8px;
    border-bottom: 1px solid var(--borde);
  }
  .fila {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px;
    scrollbar-width: none;
  }
  .fila::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    border: 1px solid var(--borde); background: var(--tarjeta); color: var(--texto);
    border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 0.9rem;
    cursor: pointer; white-space: nowrap;
  }
  .chip[aria-pressed="true"] {
    background: var(--acento); border-color: var(--acento); color: var(--acento-texto);
    font-weight: 600;
  }
  .chip .n { opacity: 0.7; font-weight: normal; margin-left: 4px; }

  .resumen { color: var(--suave); font-size: 0.9rem; margin: 14px 0 10px; }

  /* Tarjetas de avisos */
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .aviso a {
    display: block; text-decoration: none; color: inherit;
    background: var(--tarjeta); border: 1px solid var(--borde);
    border-radius: 14px; padding: 14px 16px;
  }
  .aviso a:hover, .aviso a:focus-visible { border-color: var(--acento); }
  .aviso.es-nuevo a { border-left: 4px solid var(--nuevo); }
  .titulo { margin: 0; font-size: 1.05rem; font-weight: 650; overflow-wrap: anywhere; }
  .empresa { margin: 2px 0 0; color: var(--suave); }
  .datos {
    display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px;
    font-size: 0.85rem; color: var(--suave);
  }
  .etiqueta {
    display: inline-block; font-size: 0.75rem; font-weight: 700;
    padding: 2px 8px; border-radius: 6px; margin-right: 6px; vertical-align: 2px;
  }
  .etiqueta.nuevo { background: var(--nuevo); color: var(--nuevo-texto); }
  .etiqueta.modo { border: 1px solid var(--borde); color: var(--texto); font-weight: 600; }

  .vacio { text-align: center; color: var(--suave); padding: 40px 16px; }
  footer { margin-top: 32px; color: var(--suave); font-size: 0.8rem; text-align: center; }
</style>
</head>
<body>
<div class="contenedor">
  <header>
    <h1>⚽ Laburo Deportivo</h1>
    <p class="actualizado" id="actualizado">Cargando avisos…</p>
    <div id="alertas"></div>
  </header>

  <div class="filtros">
    <div class="fila" id="filtro-nuevos"></div>
    <div class="fila" id="filtro-modalidad"></div>
    <div class="fila" id="filtro-fuente"></div>
  </div>

  <p class="resumen" id="resumen"></p>
  <ul id="lista"></ul>

  <footer>Se actualiza solo a las 8, 14 y 20 hs. Tocá un aviso para ver el original.</footer>
</div>

<script>
  // Fecha de hoy en Argentina, en formato AAAA-MM-DD (igual que en jobs.json)
  const HOY = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Argentina/Buenos_Aires" })
    .format(new Date());

  const MODALIDADES = ["Remoto", "Híbrido", "Presencial", "Sin dato"];

  // Lo que eligió la persona en los filtros
  const elegido = { soloNuevos: false, modalidad: "Todas", fuente: "Todas" };
  let avisos = [];

  fetch("jobs.json", { cache: "no-store" })
    .then(r => r.json())
    .then(datos => {
      avisos = datos.avisos.map(a => ({ ...a, nuevo: a.primera_vez === HOY }));
      mostrarEncabezado(datos);
      dibujar();
    })
    .catch(() => {
      document.getElementById("actualizado").textContent =
        "No se pudieron cargar los avisos. Probá recargar la página.";
    });

  function mostrarEncabezado(datos) {
    const cuando = new Date(datos.actualizado);
    document.getElementById("actualizado").textContent =
      "Actualizado " + cuando.toLocaleString("es-AR", {
        timeZone: "America/Argentina/Buenos_Aires",
        weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit", hour12: false,
      }) + " hs";

    const caidas = Object.entries(datos.fuentes).filter(([, e]) => !e.ok).map(([n]) => n);
    if (caidas.length) {
      const div = document.createElement("p");
      div.className = "alerta";
      div.textContent = "⚠️ No se pudo leer: " + caidas.join(", ") +
        ". Se muestran los últimos avisos que teníamos de ahí.";
      document.getElementById("alertas").append(div);
    }
  }

  function dibujar() {
    // Cada filtro cuenta cuántos avisos hay teniendo en cuenta los OTROS filtros
    const pasa = (a, ignorar) =>
      (ignorar === "nuevos" || !elegido.soloNuevos || a.nuevo) &&
      (ignorar === "modalidad" || elegido.modalidad === "Todas" || a.modalidad === elegido.modalidad) &&
      (ignorar === "fuente" || elegido.fuente === "Todas" || a.fuente === elegido.fuente);

    const contar = (ignorar, cond) => avisos.filter(a => pasa(a, ignorar) && cond(a)).length;

    chips("filtro-nuevos", [
      { texto: "Todos", n: contar("nuevos", () => true), activo: !elegido.soloNuevos,
        al: () => elegido.soloNuevos = false },
      { texto: "✨ Solo nuevos de hoy", n: contar("nuevos", a => a.nuevo), activo: elegido.soloNuevos,
        al: () => elegido.soloNuevos = true },
    ]);

    chips("filtro-modalidad", ["Todas", ...MODALIDADES]
      .filter(m => m === "Todas" || avisos.some(a => a.modalidad === m))
      .map(m => ({
        texto: m === "Todas" ? "Toda modalidad" : m,
        n: contar("modalidad", a => m === "Todas" || a.modalidad === m),
        activo: elegido.modalidad === m,
        al: () => elegido.modalidad = m,
      })));

    const fuentes = [...new Set(avisos.map(a => a.fuente))].sort();
    chips("filtro-fuente", ["Todas", ...fuentes].map(f => ({
      texto: f === "Todas" ? "Todas las fuentes" : f,
      n: contar("fuente", a => f === "Todas" || a.fuente === f),
      activo: elegido.fuente === f,
      al: () => elegido.fuente = f,
    })));

    const visibles = avisos
      .filter(a => pasa(a))
      .sort((x, y) => (y.nuevo - x.nuevo) || y.fecha.localeCompare(x.fecha));

    const nuevos = visibles.filter(a => a.nuevo).length;
    document.getElementById("resumen").textContent =
      `${visibles.length} aviso${visibles.length === 1 ? "" : "s"}` +
      (nuevos ? ` · ${nuevos} nuevo${nuevos === 1 ? "" : "s"} hoy` : "");

    const lista = document.getElementById("lista");
    lista.replaceChildren(...visibles.map(tarjeta));
    if (!visibles.length) {
      const li = document.createElement("li");
      li.className = "vacio";
      li.textContent = elegido.soloNuevos
        ? "Hoy todavía no apareció nada nuevo. Se vuelve a buscar a las 8, 14 y 20 hs."
        : "No hay avisos con estos filtros.";
      lista.append(li);
    }
  }

  function chips(id, opciones) {
    const fila = document.getElementById(id);
    fila.replaceChildren(...opciones.map(o => {
      const b = document.createElement("button");
      b.className = "chip";
      b.setAttribute("aria-pressed", o.activo);
      b.innerHTML = `${escapar(o.texto)}<span class="n">${o.n}</span>`;
      b.onclick = () => { o.al(); dibujar(); };
      return b;
    }));
  }

  function tarjeta(a) {
    const li = document.createElement("li");
    li.className = "aviso" + (a.nuevo ? " es-nuevo" : "");
    const lugar = a.ubicacion ? `📍 ${escapar(a.ubicacion)}` : "";
    li.innerHTML = `
      <a href="${escapar(a.link)}" target="_blank" rel="noopener">
        <p class="titulo">${a.nuevo ? '<span class="etiqueta nuevo">NUEVO</span>' : ""}${escapar(a.titulo)}</p>
        ${a.empresa ? `<p class="empresa">${escapar(a.empresa)}</p>` : ""}
        <div class="datos">
          <span><span class="etiqueta modo">${escapar(a.modalidad)}</span></span>
          ${lugar ? `<span>${lugar}</span>` : ""}
          <span>📅 ${fechaLinda(a.fecha)}</span>
          <span>🔗 ${escapar(a.fuente)}</span>
        </div>
      </a>`;
    return li;
  }

  function fechaLinda(iso) {
    if (iso === HOY) return "hoy";
    const dias = Math.round((new Date(HOY) - new Date(iso)) / 86400000);
    if (dias === 1) return "ayer";
    if (dias < 7) return `hace ${dias} días`;
    return new Date(iso + "T12:00").toLocaleDateString("es-AR", { day: "numeric", month: "short" });
  }

  function escapar(txt) {
    return String(txt).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
</script>
</body>
</html>
