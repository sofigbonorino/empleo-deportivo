<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laburo Deportivo</title>
<meta name="description" content="Avisos de periodismo y contenido deportivo, actualizados tres veces por día.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@900&display=swap">
<style>
  /* Diseño "recortes de diario pegados en un corcho".
     Es el mismo en modo claro y oscuro: el corcho y el papel no cambian de color. */
  :root {
    --corcho: #c99e6b;
    --papel: #f5efe1;
    --tinta: #1d1a16;
    --tinta-suave: #5b544a;
    --tinta-corcho: #2b2014;   /* texto escrito directo sobre el corcho */
    --punteado: #b7aa90;
    --pastilla: #cfc3a8;
    --nuevo: #b3261e;
    --error-fondo: #fdecea;
    --error-texto: #8a1c12;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--tinta);
    font: 16px/1.45 "PT Serif", Georgia, serif;
    /* Corcho: dos capas de puntitos de distinto tono */
    background-color: var(--corcho);
    background-image:
      radial-gradient(#b88a57 1.2px, transparent 1.3px),
      radial-gradient(#d8b386 1px, transparent 1.1px);
    background-size: 9px 9px, 13px 13px;
    background-position: 0 0, 4px 6px;
  }
  .contenedor { max-width: 1120px; margin: 0 auto; padding: 0 16px 48px; }

  /* Cabezal: el título también es un recorte */
  header { padding: 24px 0 8px; text-align: center; }
  h1 {
    display: inline-block; margin: 0; padding: 8px 18px;
    background: var(--papel); transform: rotate(-1.5deg);
    font-family: "Playfair Display", Georgia, serif; font-weight: 900;
    font-size: clamp(1.8rem, 7vw, 3rem); letter-spacing: -0.01em;
    box-shadow: 0 3px 6px rgb(0 0 0 / 0.25);
  }
  .actualizado { margin: 12px 0 0; color: var(--tinta-corcho); font-weight: 700; font-size: 0.9rem; }
  .alerta {
    margin: 12px auto 0; max-width: 520px; padding: 10px 12px; border-radius: 10px;
    background: var(--error-fondo); color: var(--error-texto); font-size: 0.9rem;
  }

  /* Solapas: dos botones pegados que ocupan todo el ancho */
  .filtros { padding: 12px 0 0; }
  .solapas {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
    padding: 4px; margin-bottom: 10px; max-width: 520px;
    background: rgb(0 0 0 / 0.25); border-radius: 12px;
  }
  .solapa {
    border: 0; border-radius: 9px; padding: 9px 8px;
    background: transparent; color: #fff;
    font: inherit; font-size: 0.9rem; font-weight: 700; cursor: pointer;
  }
  .solapa[aria-pressed="true"] {
    background: var(--papel); color: var(--tinta);
    box-shadow: 0 1px 3px rgb(0 0 0 / 0.12);
  }
  .solapa .n, .chip .n { opacity: 0.65; font-weight: normal; margin-left: 5px; }

  /* Filtros: fila de "chips" que se puede deslizar con el dedo */
  .fila {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px;
    scrollbar-width: none;
  }
  .fila::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    border: 0; background: var(--papel); color: var(--tinta);
    border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 0.9rem;
    cursor: pointer; white-space: nowrap;
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.2);
  }
  .chip[aria-pressed="true"] { background: var(--tinta); color: var(--papel); font-weight: 700; }

  .resumen { color: var(--tinta-corcho); font-weight: 700; font-size: 0.9rem; margin: 10px 0 14px; }

  /* Avisos: recortes en grilla (una columna en el celu, dos o tres en la compu) */
  ul {
    list-style: none; margin: 0; padding: 10px 0 0;
    display: grid; gap: 26px 20px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
  }
  .aviso { position: relative; }
  .aviso a {
    display: flex; flex-direction: column; height: 100%;
    text-decoration: none; color: inherit; background: var(--papel);
    box-shadow: 0 4px 10px rgb(0 0 0 / 0.3);
    outline: 1px dashed var(--punteado); outline-offset: -8px;  /* línea de "cortar acá" */
    transition: transform 0.15s, box-shadow 0.15s;
  }
  /* Cada recorte, un poquito torcido */
  .aviso:nth-child(3n+1) a { transform: rotate(-1.2deg); }
  .aviso:nth-child(3n+2) a { transform: rotate(0.9deg); }
  .aviso:nth-child(3n) a { transform: rotate(-0.4deg); }
  .aviso a:hover, .aviso a:focus-visible { transform: rotate(0) scale(1.02); box-shadow: 0 8px 18px rgb(0 0 0 / 0.35); }
  /* Cinta adhesiva arriba */
  .aviso::before {
    content: ""; position: absolute; z-index: 1; top: -10px; left: 50%;
    width: 90px; height: 22px; margin-left: -45px;
    background: rgb(255 255 240 / 0.6); transform: rotate(-3deg);
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.15);
  }

  .cabeza {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 18px 16px 0;
    font-size: 0.7rem; font-weight: 700; color: var(--tinta-suave);
    text-transform: uppercase; letter-spacing: 0.15em;
  }
  .etiqueta.nuevo {
    background: var(--nuevo); color: #fff; transform: rotate(-4deg);
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em;
    padding: 3px 8px; border-radius: 4px;
  }
  .cuerpo { padding: 8px 16px 14px; flex: 1; }
  .titulo {
    margin: 0; font-family: "Playfair Display", Georgia, serif;
    font-size: 1.25rem; line-height: 1.25; overflow-wrap: anywhere;
  }
  .empresa { margin: 4px 0 0; color: var(--tinta-suave); font-style: italic; }
  .datos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .dato { font-size: 0.8rem; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--pastilla); }

  .pie {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px 14px; border-top: 1px dashed var(--punteado);
    font-size: 0.85rem; color: var(--tinta-suave);
  }
  .ver { color: var(--tinta); font-weight: 700; }

  .vacio {
    grid-column: 1 / -1; text-align: center; padding: 32px 16px;
    background: var(--papel); box-shadow: 0 4px 10px rgb(0 0 0 / 0.3);
  }
  footer { margin-top: 36px; color: var(--tinta-corcho); font-size: 0.85rem; text-align: center; }
</style>
</head>
<body>
<div class="contenedor">
  <header>
    <h1>🏉 Laburo Deportivo</h1>
    <p class="actualizado" id="actualizado">Cargando avisos…</p>
    <div id="alertas"></div>
  </header>

  <div class="filtros">
    <div class="solapas" id="solapas"></div>
    <div class="fila" id="filtro-nuevos"></div>
    <div class="fila" id="filtro-modalidad"></div>
    <div class="fila" id="filtro-fuente"></div>
  </div>

  <p class="resumen" id="resumen"></p>
  <ul id="lista"></ul>

  <footer>Se actualiza solo a las 8, 14 y 20 hs. Tocá un aviso para ver el original.</footer>
</div>

<script>
  // Fecha de hoy en Argentina, en formato AAAA-MM-DD (igual que en jobs.json)
  const HOY = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Argentina/Buenos_Aires" })
    .format(new Date());

  const MODALIDADES = ["Remoto", "Híbrido", "Presencial", "Sin dato"];

  // Lo que eligió la persona en los filtros
  const elegido = { exterior: false, soloNuevos: false, modalidad: "Todas", fuente: "Todas" };
  let avisos = [];

  fetch("jobs.json", { cache: "no-store" })
    .then(r => r.json())
    .then(datos => {
      avisos = datos.avisos.map(a => ({ ...a, nuevo: a.primera_vez === HOY }));
      mostrarEncabezado(datos);
      dibujar();
    })
    .catch(() => {
      document.getElementById("actualizado").textContent =
        "No se pudieron cargar los avisos. Probá recargar la página.";
    });

  function mostrarEncabezado(datos) {
    const cuando = new Date(datos.actualizado);
    document.getElementById("actualizado").textContent =
      "Actualizado " + cuando.toLocaleString("es-AR", {
        timeZone: "America/Argentina/Buenos_Aires",
        weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit", hour12: false,
      }) + " hs";

    const caidas = Object.entries(datos.fuentes).filter(([, e]) => !e.ok).map(([n]) => n);
    if (caidas.length) {
      const div = document.createElement("p");
      div.className = "alerta";
      div.textContent = "⚠️ No se pudo leer: " + caidas.join(", ") +
        ". Se muestran los últimos avisos que teníamos de ahí.";
      document.getElementById("alertas").append(div);
    }
  }

  function dibujar() {
    // Cada filtro cuenta cuántos avisos hay teniendo en cuenta los OTROS filtros
    const pasa = (a, ignorar) =>
      (ignorar === "solapa" || !!a.exterior === elegido.exterior) &&
      (ignorar === "nuevos" || !elegido.soloNuevos || a.nuevo) &&
      (ignorar === "modalidad" || elegido.modalidad === "Todas" || a.modalidad === elegido.modalidad) &&
      (ignorar === "fuente" || elegido.fuente === "Todas" || a.fuente === elegido.fuente);

    const contar = (ignorar, cond) => avisos.filter(a => pasa(a, ignorar) && cond(a)).length;

    // Solapas: al cambiar de solapa se limpian los otros filtros
    const solapas = document.getElementById("solapas");
    solapas.replaceChildren(...[
      { texto: "📍 Argentina y remoto", exterior: false },
      { texto: "🌎 Freelance exterior", exterior: true },
    ].map(s => {
      const b = document.createElement("button");
      b.className = "solapa";
      b.setAttribute("aria-pressed", elegido.exterior === s.exterior);
      const n = avisos.filter(a => !!a.exterior === s.exterior).length;
      b.innerHTML = `${s.texto}<span class="n">${n}</span>`;
      b.onclick = () => {
        Object.assign(elegido, { exterior: s.exterior, soloNuevos: false, modalidad: "Todas", fuente: "Todas" });
        dibujar();
      };
      return b;
    }));

    chips("filtro-nuevos", [
      { texto: "Todos", n: contar("nuevos", () => true), activo: !elegido.soloNuevos,
        al: () => elegido.soloNuevos = false },
      { texto: "✨ Solo nuevos de hoy", n: contar("nuevos", a => a.nuevo), activo: elegido.soloNuevos,
        al: () => elegido.soloNuevos = true },
    ]);

    chips("filtro-modalidad", ["Todas", ...MODALIDADES]
      .filter(m => m === "Todas" || avisos.some(a => a.modalidad === m))
      .map(m => ({
        texto: m === "Todas" ? "Toda modalidad" : m,
        n: contar("modalidad", a => m === "Todas" || a.modalidad === m),
        activo: elegido.modalidad === m,
        al: () => elegido.modalidad = m,
      })));

    const fuentes = [...new Set(avisos.map(a => a.fuente))].sort();
    chips("filtro-fuente", ["Todas", ...fuentes].map(f => ({
      texto: f === "Todas" ? "Todas las fuentes" : f,
      n: contar("fuente", a => f === "Todas" || a.fuente === f),
      activo: elegido.fuente === f,
      al: () => elegido.fuente = f,
    })));

    const visibles = avisos
      .filter(a => pasa(a))
      .sort((x, y) => (y.nuevo - x.nuevo) || y.fecha.localeCompare(x.fecha));

    const nuevos = visibles.filter(a => a.nuevo).length;
    document.getElementById("resumen").textContent =
      `${visibles.length} aviso${visibles.length === 1 ? "" : "s"}` +
      (nuevos ? ` · ${nuevos} nuevo${nuevos === 1 ? "" : "s"} hoy` : "");

    const lista = document.getElementById("lista");
    lista.replaceChildren(...visibles.map(tarjeta));
    if (!visibles.length) {
      const li = document.createElement("li");
      li.className = "vacio";
      li.textContent = elegido.soloNuevos
        ? "Hoy todavía no apareció nada nuevo. Se vuelve a buscar a las 8, 14 y 20 hs."
        : "No hay avisos con estos filtros.";
      lista.append(li);
    }
  }

  function chips(id, opciones) {
    const fila = document.getElementById(id);
    fila.replaceChildren(...opciones.map(o => {
      const b = document.createElement("button");
      b.className = "chip";
      b.setAttribute("aria-pressed", o.activo);
      b.innerHTML = `${escapar(o.texto)}<span class="n">${o.n}</span>`;
      b.onclick = () => { o.al(); dibujar(); };
      return b;
    }));
  }

  function tarjeta(a) {
    const li = document.createElement("li");
    li.className = "aviso";
    const iconoModo = { "Remoto": "🏠", "Híbrido": "🔀", "Presencial": "🏢" }[a.modalidad] || "❔";
    li.innerHTML = `
      <a href="${escapar(a.link)}" target="_blank" rel="noopener">
        <div class="cabeza">
          <span>${escapar(a.fuente)}</span>
          ${a.nuevo ? '<span class="etiqueta nuevo">NUEVO</span>' : ""}
        </div>
        <div class="cuerpo">
          <p class="titulo">${escapar(a.titulo)}</p>
          ${a.empresa ? `<p class="empresa">${escapar(a.empresa)}</p>` : ""}
          <div class="datos">
            <span class="dato">${iconoModo} ${escapar(a.modalidad)}</span>
            ${a.ubicacion ? `<span class="dato">📍 ${escapar(a.ubicacion)}</span>` : ""}
          </div>
        </div>
        <div class="pie">
          <span>📅 ${fechaLinda(a.fecha)}</span>
          <span class="ver">Ver aviso →</span>
        </div>
      </a>`;
    return li;
  }

  function fechaLinda(iso) {
    if (iso === HOY) return "hoy";
    const dias = Math.round((new Date(HOY) - new Date(iso)) / 86400000);
    if (dias === 1) return "ayer";
    if (dias < 7) return `hace ${dias} días`;
    return new Date(iso + "T12:00").toLocaleDateString("es-AR", { day: "numeric", month: "short" });
  }

  function escapar(txt) {
    return String(txt).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
</script>
</body>
</html>
